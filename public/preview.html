<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Live Preview</title>
  <style>
    body{font-family:Arial;margin:16px}
    .product-grid{display:flex;gap:12px;flex-wrap:wrap}
    .card{border:1px solid #ddd;padding:12px;width:200px}
  </style>
</head>
<body>
  <h1>Live Preview</h1>
  <div id="preview"></div>
  <script>
    async function load(){
      const [bRes, pRes] = await Promise.all([
        fetch('data/brands/jk_cement.json'),
        fetch('data/catalog/jk_cement_products.json')
      ]);
      const brand = await bRes.json();
      const products = await pRes.json();
      const root = document.getElementById('preview');
      const grid = document.createElement('div'); grid.className='product-grid';
      products.forEach(p=>{
        const d = document.createElement('div'); d.className='card';
        d.innerHTML = `<h3 style="color:${brand.colors.brand}">${p.name}</h3><div>₹${p.price}</div>`;
        grid.appendChild(d);
      });
      root.appendChild(grid);
    }
    load();
  </script>
</body>
</html>
