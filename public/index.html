<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Demo Generator</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="wrap">
    <h1>Demo Generator</h1>
    <p id="modeIndicator" class="lead">Loading...</p>

    <section class="card" id="staticSection">
      <h2>Brand Demos</h2>
      <p class="muted">Select a brand and journey to view the pre-built interactive demo.</p>
      <div id="brandList"></div>
    </section>

    <section class="card" id="runtimeSection" style="display:none">
      <h2>Upload & Generate</h2>
      <div id="sessionBox" class="muted" style="margin-bottom:12px"></div>
      <h3>Brand</h3>
      <label class="file-row">Logo (png/jpg/webp)
        <input id="logoInput" type="file" accept="image/*">
      </label>
      <label class="file-row">Catalog (csv/xlsx/json, optional)
        <input id="catalogInput" type="file" accept=".csv,.xlsx,application/json">
      </label>
      <h3 style="margin-top:16px">Journeys</h3>
      <div class="grid" id="journeyList">
        <label><input type="checkbox" value="order_to_cash" checked> Order to Cash</label>
        <label><input type="checkbox" value="field_ops_expense"> Field Ops</label>
        <label><input type="checkbox" value="automated_collections"> Collections</label>
        <label><input type="checkbox" value="dealer_engagement"> Dealer Engagement</label>
        <label><input type="checkbox" value="retailer_onboarding"> Onboarding</label>
        <label><input type="checkbox" value="retailer_loyalty"> Loyalty</label>
      </div>
      <button id="generateBtn" onclick="generate()" class="btn primary" style="margin-top:12px">Generate</button>
      <div id="genStatus" class="muted" style="margin-top:8px"></div>
    </section>

    <footer class="muted small">ZoTok Demo Generator &mdash; static demos + runtime generation</footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
