<svg viewBox="0 0 260 140" width="260" height="140" xmlns="http://www.w3.org/2000/svg">
                      <!-- Sky gradient background is CSS; draw sun + panels -->
                      <!-- Sun glow halo -->
                      <circle cx="130" cy="56" r="46" fill="rgba(255,255,255,.12)"/>
                      <circle cx="130" cy="56" r="34" fill="rgba(255,255,255,.18)"/>
                      <!-- Sun rays -->
                      <g stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".65">
                        <line x1="130" y1="8" x2="130" y2="18"/>
                        <line x1="159" y1="17" x2="153" y2="25"/>
                        <line x1="178" y1="42" x2="169" y2="46"/>
                        <line x1="182" y1="72" x2="172" y2="70"/>
                        <line x1="165" y1="97" x2="158" y2="90"/>
                        <line x1="101" y1="17" x2="107" y2="25"/>
                        <line x1="82" y1="42" x2="91" y2="46"/>
                        <line x1="78" y1="72" x2="88" y2="70"/>
                        <line x1="95" y1="97" x2="102" y2="90"/>
                      </g>
                      <!-- Sun core -->
                      <circle cx="130" cy="56" r="22" fill="#fff" opacity=".92"/>
                      <!-- House silhouette -->
                      <g opacity=".85">
                        <!-- Roof -->
                        <polygon points="42,98 90,68 138,98" fill="rgba(30,15,5,.55)"/>
                        <!-- Wall -->
                        <rect x="50" y="98" width="80" height="38" fill="rgba(30,15,5,.45)"/>
                        <!-- Door -->
                        <rect x="80" y="114" width="20" height="22" fill="rgba(30,15,5,.7)"/>
                        <!-- Solar panels on roof -->
                        <rect x="52" y="78" width="16" height="10" rx="1.5" fill="#FDB813" opacity=".9"/>
                        <rect x="71" y="72" width="16" height="10" rx="1.5" fill="#FDB813" opacity=".9"/>
                        <rect x="90" y="68" width="16" height="10" rx="1.5" fill="#FDB813" opacity=".9"/>
                        <!-- Panel grid lines -->
                        <line x1="60" y1="78" x2="60" y2="88" stroke="#F15A24" stroke-width=".8"/>
                        <line x1="52" y1="83" x2="68" y2="83" stroke="#F15A24" stroke-width=".8"/>
                        <line x1="79" y1="72" x2="79" y2="82" stroke="#F15A24" stroke-width=".8"/>
                        <line x1="71" y1="77" x2="87" y2="77" stroke="#F15A24" stroke-width=".8"/>
                        <line x1="98" y1="68" x2="98" y2="78" stroke="#F15A24" stroke-width=".8"/>
                        <line x1="90" y1="73" x2="106" y2="73" stroke="#F15A24" stroke-width=".8"/>
                      </g>
                      <!-- Tagline text area -->
                      <rect x="148" y="100" width="100" height="34" rx="6" fill="rgba(0,0,0,.28)"/>
                      <text x="198" y="114" text-anchor="middle" font-size="9" fill="#FDB813" font-family="sans-serif" font-weight="700">FREYR SOLAR</text>
                      <text x="198" y="126" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,.88)" font-family="sans-serif">Bijli bachao, future banao</text>
                    </svg>