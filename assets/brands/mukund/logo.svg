<svg width="100%" height="100%" viewBox="0 0 560 500" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                  <!-- Map background -->
                  <rect width="560" height="500" fill="#e8e0d8"/>
                  <!-- Green areas / parks -->
                  <ellipse cx="80" cy="80" rx="60" ry="40" fill="#c8ddb0" opacity=".7"/>
                  <ellipse cx="430" cy="60" rx="55" ry="35" fill="#c8ddb0" opacity=".6"/>
                  <ellipse cx="310" cy="380" rx="45" ry="30" fill="#c8ddb0" opacity=".6"/>
                  <rect x="480" y="280" width="70" height="55" rx="6" fill="#c8ddb0" opacity=".5"/>
                  <!-- Water body -->
                  <ellipse cx="50" cy="340" rx="40" ry="22" fill="#b3d4f0" opacity=".8"/>
                  <!-- Major ring road (outer) -->
                  <path d="M20 200 Q100 20 280 15 Q460 10 540 200 Q560 380 400 470 Q280 500 160 470 Q20 430 20 200z" fill="none" stroke="#fff" stroke-width="14" opacity=".9"/>
                  <path d="M20 200 Q100 20 280 15 Q460 10 540 200 Q560 380 400 470 Q280 500 160 470 Q20 430 20 200z" fill="none" stroke="#e0d8cc" stroke-width="3" opacity=".6"/>
                  <!-- Main roads grid -->
                  <line x1="0" y1="250" x2="560" y2="250" stroke="#fff" stroke-width="8"/>
                  <line x1="0" y1="250" x2="560" y2="250" stroke="#d4cdc5" stroke-width="1" opacity=".5"/>
                  <line x1="280" y1="0" x2="280" y2="500" stroke="#fff" stroke-width="8"/>
                  <line x1="280" y1="0" x2="280" y2="500" stroke="#d4cdc5" stroke-width="1" opacity=".5"/>
                  <!-- Secondary roads -->
                  <line x1="0" y1="140" x2="560" y2="160" stroke="#fff" stroke-width="5"/>
                  <line x1="0" y1="370" x2="560" y2="360" stroke="#fff" stroke-width="5"/>
                  <line x1="140" y1="0" x2="120" y2="500" stroke="#fff" stroke-width="5"/>
                  <line x1="420" y1="0" x2="440" y2="500" stroke="#fff" stroke-width="5"/>
                  <!-- Diagonal roads -->
                  <path d="M0 0 Q140 130 280 250" fill="none" stroke="#fff" stroke-width="4"/>
                  <path d="M560 0 Q420 130 280 250" fill="none" stroke="#fff" stroke-width="4"/>
                  <path d="M560 500 Q400 370 280 250" fill="none" stroke="#fff" stroke-width="4"/>
                  <path d="M0 500 Q140 370 280 250" fill="none" stroke="#fff" stroke-width="4"/>
                  <!-- Narrow streets -->
                  <line x1="0" y1="310" x2="560" y2="300" stroke="#f0ece6" stroke-width="3"/>
                  <line x1="0" y1="190" x2="560" y2="200" stroke="#f0ece6" stroke-width="3"/>
                  <line x1="200" y1="0" x2="190" y2="500" stroke="#f0ece6" stroke-width="3"/>
                  <line x1="370" y1="0" x2="360" y2="500" stroke="#f0ece6" stroke-width="3"/>
                  <!-- Small building blocks -->
                  <rect x="30" y="160" width="90" height="70" rx="3" fill="#d8d0c8" opacity=".5"/>
                  <rect x="160" y="20" width="100" height="100" rx="3" fill="#d8d0c8" opacity=".5"/>
                  <rect x="310" y="20" width="90" height="90" rx="3" fill="#d8d0c8" opacity=".5"/>
                  <rect x="310" y="170" width="80" height="55" rx="3" fill="#d8d0c8" opacity=".4"/>
                  <rect x="400" y="160" width="120" height="70" rx="3" fill="#d8d0c8" opacity=".5"/>
                  <rect x="30" y="270" width="80" height="60" rx="3" fill="#d8d0c8" opacity=".4"/>
                  <rect x="160" y="270" width="90" height="65" rx="3" fill="#d8d0c8" opacity=".4"/>
                  <rect x="160" y="380" width="100" height="80" rx="3" fill="#d8d0c8" opacity=".4"/>
                  <rect x="30" y="370" width="85" height="80" rx="3" fill="#d8d0c8" opacity=".4"/>
                  <rect x="400" y="270" width="120" height="60" rx="3" fill="#d8d0c8" opacity=".4"/>
                  <rect x="400" y="370" width="120" height="80" rx="3" fill="#d8d0c8" opacity=".4"/>
                  <!-- Map labels -->
                  <text x="160" y="75" font-size="9" fill="#888" font-family="sans-serif">Banjara Hills</text>
                  <text x="300" y="210" font-size="8" fill="#888" font-family="sans-serif">Jubilee Hills</text>
                  <text x="400" y="310" font-size="8" fill="#888" font-family="sans-serif">HITEC City</text>
                  <text x="40" y="290" font-size="8" fill="#888" font-family="sans-serif">Secunderabad</text>
                  <text x="60" y="140" font-size="8" fill="#888" font-family="sans-serif">Kukatpally</text>

                  <!-- ZO Pin 1: Clock-In (Mukund Office, bottom-left area) -->
                  <g transform="translate(75,420)">
                    <path d="M0-22 Q10-22 10-12 Q10 0 0 10 Q-10 0 -10-12 Q-10-22 0-22z" fill="#2E7D32"/>
                    <circle cx="0" cy="-12" r="7" fill="#fff"/>
                    <text x="0" y="-9" text-anchor="middle" font-size="7" font-weight="800" fill="#2E7D32" font-family="sans-serif">ZO</text>
                    <text x="0" y="16" text-anchor="middle" font-size="7.5" fill="#444" font-family="sans-serif">Clock-In</text>
                  </g>

                  <!-- ZO Pin 2: Om Sai (Jubilee Hills) -->
                  <g transform="translate(320,240)">
                    <path d="M0-22 Q10-22 10-12 Q10 0 0 10 Q-10 0 -10-12 Q-10-22 0-22z" fill="#00897B"/>
                    <circle cx="0" cy="-12" r="7" fill="#fff"/>
                    <text x="0" y="-9" text-anchor="middle" font-size="7" font-weight="800" fill="#00897B" font-family="sans-serif">ZO</text>
                    <text x="0" y="16" text-anchor="middle" font-size="7.5" fill="#444" font-family="sans-serif">Check-In</text>
                  </g>

                  <!-- ZO Pin 3: Lanco Hills Technology Park (HITEC City) -->
                  <g transform="translate(440,315)">
                    <path d="M0-22 Q10-22 10-12 Q10 0 0 10 Q-10 0 -10-12 Q-10-22 0-22z" fill="#00897B"/>
                    <circle cx="0" cy="-12" r="7" fill="#fff"/>
                    <text x="0" y="-9" text-anchor="middle" font-size="7" font-weight="800" fill="#00897B" font-family="sans-serif">ZO</text>
                    <text x="0" y="16" text-anchor="middle" font-size="7.5" fill="#444" font-family="sans-serif">Check-In</text>
                  </g>

                  <!-- ZO Pin 4: Indu Projects Ltd (Banjara Hills) — with order -->
                  <g transform="translate(195,80)">
                    <path d="M0-26 Q12-26 12-14 Q12 0 0 12 Q-12 0 -12-14 Q-12-26 0-26z" fill="#1565C0"/>
                    <circle cx="0" cy="-14" r="8" fill="#fff"/>
                    <text x="0" y="-11" text-anchor="middle" font-size="7" font-weight="800" fill="#1565C0" font-family="sans-serif">ZO</text>
                    <text x="0" y="18" text-anchor="middle" font-size="7.5" fill="#444" font-family="sans-serif">Order + Check-In</text>
                  </g>

                  <!-- ZO Pin 5: Clock-Out (same area as Indu Projects Ltd, end of day) -->
                  <g transform="translate(130,150)">
                    <path d="M0-22 Q10-22 10-12 Q10 0 0 10 Q-10 0 -10-12 Q-10-22 0-22z" fill="#E65100"/>
                    <circle cx="0" cy="-12" r="7" fill="#fff"/>
                    <text x="0" y="-9" text-anchor="middle" font-size="7" font-weight="800" fill="#E65100" font-family="sans-serif">ZO</text>
                    <text x="0" y="16" text-anchor="middle" font-size="7.5" fill="#444" font-family="sans-serif">Clock-Out</text>
                  </g>

                  <!-- Route line connecting pins -->
                  <polyline points="75,398 100,300 195,80 320,220 440,293 130,128" fill="none" stroke="#1565C0" stroke-width="2" stroke-dasharray="6 4" opacity=".5"/>
                </svg>